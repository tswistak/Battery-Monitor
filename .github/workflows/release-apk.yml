name: Build APK Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag format
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' must match SemVer (examples: 1.0.0, 1.0.0-prerelease, 1.0.0+build.1)"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build signed release APK
        env:
          CI_VERSION_NAME: ${{ github.ref_name }}
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon clean :app:assembleRelease

      - name: Rename APK for release asset
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          cp "$APK_PATH" "dist/battery-monitor-${GITHUB_REF_NAME}.apk"

      - name: Determine release channel
        id: release_channel
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes from CHANGELOG
        id: changelog_notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE_VERSION="${TAG%%[-+]*}"
          NOTES_FILE="dist/release-notes.md"

          if [[ ! -f CHANGELOG.md ]]; then
            echo "CHANGELOG.md not found"
            exit 1
          fi

          awk -v version="$BASE_VERSION" '
            BEGIN { in_section=0; found=0 }
            $0 ~ "^## " version "$" { in_section=1; found=1; next }
            in_section && $0 ~ "^## " { exit }
            in_section { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "No release notes content found for version $BASE_VERSION in CHANGELOG.md"
            exit 1
          fi

          echo "notes_path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.release_channel.outputs.prerelease }}
          generate_release_notes: false
          body_path: ${{ steps.changelog_notes.outputs.notes_path }}
          files: |
            dist/battery-monitor-${{ github.ref_name }}.apk
