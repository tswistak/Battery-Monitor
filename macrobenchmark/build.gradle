apply plugin: 'com.android.test'

android {
    namespace 'codes.swistak.batterymonitor.macrobenchmark'
    compileSdk 37
    targetProjectPath ':app'
    experimentalProperties['android.experimental.self-instrumenting'] = true

    defaultConfig {
        minSdk 26
        targetSdk 37
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        testInstrumentationRunnerArguments['androidx.benchmark.fullTracing.enable'] = 'true'
    }
    signingConfigs {
        profile {
            storeFile rootProject.file('captures/profiling/local-test.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        profile {
            debuggable true
            signingConfig signingConfigs.profile
            matchingFallbacks = ['release']
        }
    }
    testOptions {
        animationsDisabled false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'junit:junit:4.13.2'
    implementation 'androidx.test:runner:1.7.0'
    implementation 'androidx.test.ext:junit:1.3.0'
    implementation 'androidx.test.uiautomator:uiautomator:2.4.0'
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.5.0'
    implementation 'androidx.tracing:tracing-perfetto:1.0.1'
    implementation 'androidx.tracing:tracing-perfetto-binary:1.0.1'
}
