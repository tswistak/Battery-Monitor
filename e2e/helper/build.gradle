apply plugin: 'com.android.application'

// Keep the historical helper APK platform-only without removing Kotlin from lint's own tools.
configurations.matching { it.name.endsWith('RuntimeClasspath') }.configureEach {
    exclude group: 'org.jetbrains.kotlin'
    exclude group: 'org.jetbrains'
}

android {
    namespace = 'codes.swistak.batterymonitor.e2ehelper'
    compileSdk 37
    defaultConfig {
        applicationId 'codes.swistak.batterymonitor.e2ehelper'
        minSdk 26
        // Preserve API 35 compatibility behavior in the historical instrumentation helper.
        //noinspection OldTargetApi
        targetSdk 35
        versionCode 1
        versionName '1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        e2e {
            storeFile rootProject.file('e2e/build/test-signing.p12')
            storePassword 'battery-monitor-e2e'
            keyAlias 'e2e'
            keyPassword 'battery-monitor-e2e'
        }
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.e2e
        }
    }
}

tasks.register('verifyPlatformOnlyRuntime') {
    doLast {
        def libraries = configurations.debugRuntimeClasspath.files
        if (!libraries.isEmpty()) {
            throw new GradleException("Historical instrumentation helper must contain only platform Java; found ${libraries}")
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'verifyPlatformOnlyRuntime'
}
